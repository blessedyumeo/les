<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — Les Échos Du Passé</title>
  <meta name="description" content="Карточка товара интернет-магазина Les Échos Du Passé.">
  <meta name="theme-color" content="#f6f5f3">
  <link rel="icon" href="images/logo.png">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <script src="js/products.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/product.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="shell site-header__inner">
      <nav class="site-nav" aria-label="Основная навигация">
        <a href="index.html#catalog" class="site-nav__link">Каталог</a>
        <a href="index.html#about" class="site-nav__link">О бренде</a>
      </nav>

      <a href="index.html" class="site-logo" aria-label="Les Échos Du Passé — на главную">
        <img src="images/logo.png" alt="Les Échos Du Passé" width="42" height="42">
      </a>

      <div class="site-actions">
        <a href="https://t.me/Yoiyumeo" class="icon-link" target="_blank" rel="noopener" aria-label="Telegram">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21.9 4.3 18.8 19c-.2 1-.9 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-.9.5l.3-4.7 8.5-7.7c.4-.3-.1-.5-.6-.2L6.9 13 2.3 11.5c-1-.3-1-1 .2-1.5L20.6 3c.8-.3 1.5.2 1.3 1.3Z"/>
          </svg>
        </a>

        <button type="button" class="icon-link cart-button" id="cart-button" aria-label="Корзина пуста">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6.5 2.5 3.5 6.5v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-13l-3-4Z"/>
            <path d="M3.5 6.5h17"/>
            <path d="M16 10.5a4 4 0 0 1-8 0"/>
          </svg>
          <span class="cart-counter is-empty">0</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="breadcrumbs shell" aria-label="Хлебные крошки">
    <a href="index.html#catalog">Каталог</a> <span aria-hidden="true">/</span> <span data-crumb>Товар</span>
  </nav>

  <main class="product shell" data-product>
    <div class="product__gallery">
      <img src="" alt="" class="product__image">
    </div>

    <div class="product__info">
      <h1 class="product__title">Товар</h1>
      <p class="product__price">—</p>

      <div class="product__sizes"></div>

      <button class="btn btn--primary product__add" type="button" data-add-to-cart data-id="">
        Добавить в корзину
      </button>
      <p class="product__hint">Корзина сохраняется в браузере — вкладку можно закрыть.</p>

      <div class="product__details"></div>
    </div>
  </main>

  <section class="related shell">
    <div class="section-head">
      <h2 class="section-title">Смотрите также</h2>
      <p class="section-meta"><a href="index.html#catalog">Весь каталог →</a></p>
    </div>
    <div class="related__grid"></div>
  </section>

  <footer class="site-footer">
    <div class="shell">
      <div class="site-footer__cols">
        <div class="site-footer__brand">
          <img src="images/logo.png" alt="Les Échos Du Passé" width="48" height="48">
          <p>Небольшой независимый бренд одежды. Учебный проект.</p>
        </div>

        <div>
          <h3>Магазин</h3>
          <ul>
            <li><a href="index.html#catalog">Каталог</a></li>
            <li><a href="index.html#about">О бренде</a></li>
          </ul>
        </div>

        <div>
          <h3>Связь</h3>
          <ul>
            <li><a href="https://t.me/Yoiyumeo" target="_blank" rel="noopener">Telegram</a></li>
          </ul>
        </div>
      </div>

      <div class="site-footer__bottom">
        <span>© 2026 Les Échos Du Passé</span>
        <span>HTML · CSS · JavaScript</span>
      </div>
    </div>
  </footer>
</body>
</html>
